<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191e24">
  <title>Split</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ------------------------------------------------------ connexion -->
<section id="ecran-connexion" class="connexion">
  <form id="form-connexion" class="connexion-boite">
    <p class="marque">Split</p>
    <p class="connexion-intro">Ce serveur donne accès aux fichiers d'une seule machine. Entre le mot de passe pour l'ouvrir.</p>
    <label class="champ">
      <span>Mot de passe</span>
      <input type="password" id="champ-mdp" autocomplete="current-password" required>
    </label>
    <p id="erreur-connexion" class="erreur" hidden></p>
    <button type="submit" class="bouton-plein">Ouvrir</button>
  </form>
</section>

<!-- ------------------------------------------------------ application -->
<div id="application" class="application" hidden>

  <aside class="rail">
    <div class="rail-haut">
      <p class="marque">Split</p>
      <p class="rail-etat"><span class="lampe"></span><span id="nom-machine">connecté</span></p>
    </div>

    <nav class="rail-nav">
      <button id="bouton-racine" class="rail-lien">Tous les fichiers</button>
    </nav>

    <div class="rail-bas">
      <p class="rail-titre">Contrôle à distance</p>
      <div class="rail-paire">
        <a class="rail-tuile" href="https://remotedesktop.google.com/access" target="_blank" rel="noopener">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M2.5 3.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm1.4 1.6v7.8h12.2V5.1z" opacity=".55"/>
            <path d="M8 7.2l5 2.6-2.1.7-.7 2.1z"/>
            <path d="M6.5 16.4h7v1.3h-7z"/>
          </svg>
          <span>Chrome</span>
        </a>
        <a class="rail-tuile" href="https://web.parsec.app" target="_blank" rel="noopener">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M2.5 3.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm1.4 1.6v7.8h12.2V5.1z" opacity=".55"/>
            <path d="M6.2 7.4h2v1.5h-2zm3.4 0h4.2v1.5H9.6zM6.2 10h5.6v1.5H6.2z"/>
            <path d="M6.5 16.4h7v1.3h-7z"/>
          </svg>
          <span>Parsec</span>
        </a>
      </div>

      <button id="bouton-reveil" class="rail-lien" hidden>Réveiller le PC</button>
      <button id="bouton-extinction" class="rail-lien rail-lien--risque" hidden>Éteindre le PC</button>
      <button id="bouton-deconnexion" class="rail-lien">Fermer la session</button>
    </div>
  </aside>

  <main class="contenu">
    <header class="fil" id="fil"></header>
    <div id="liste" class="liste"></div>
    <p id="message" class="message" hidden></p>
  </main>

  <!-- Barre de transport audio : n'apparaît que pendant la lecture -->
  <footer id="transport" class="transport" hidden>
    <button id="transport-play" class="transport-bouton" aria-label="Lecture ou pause"></button>
    <div class="transport-infos">
      <p id="transport-titre" class="transport-titre"></p>
      <div class="transport-piste">
        <input type="range" id="transport-position" min="0" max="1000" value="0" aria-label="Position dans le morceau">
      </div>
    </div>
    <p class="transport-temps"><span id="transport-ecoule">0:00</span> / <span id="transport-total">0:00</span></p>
    <button id="transport-precedent" class="transport-bouton transport-bouton--petit" aria-label="Morceau précédent"></button>
    <button id="transport-suivant" class="transport-bouton transport-bouton--petit" aria-label="Morceau suivant"></button>
    <button id="transport-fermer" class="transport-bouton transport-bouton--petit" aria-label="Arrêter la lecture"></button>
  </footer>
</div>

<!-- ------------------------------------------------------ visionneuse -->
<div id="visionneuse" class="visionneuse" hidden>
  <header class="visionneuse-barre">
    <p id="visionneuse-titre" class="visionneuse-titre"></p>
    <select id="visionneuse-soustitres" class="bouton-fin" hidden aria-label="Sous-titres"></select>
    <button id="visionneuse-cast" class="bouton-fin" hidden>Envoyer sur la TV</button>
    <a id="visionneuse-telecharger" class="bouton-fin" download>Télécharger</a>
    <button id="visionneuse-fermer" class="bouton-fin" aria-label="Fermer">Fermer</button>
  </header>
  <div id="visionneuse-scene" class="visionneuse-scene"></div>
</div>

<audio id="lecteur-audio" preload="metadata"></audio>

<script src="/app.js"></script>
</body>
</html>
